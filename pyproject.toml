[project]
name = "jbiet-collage-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dandempalli Shiva", email = "dandempallishiva020@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "ipywidgets>=8.1.9",
    "jsonpatch>=1.33",
    "jupyter>=1.1.1",
    "langchain-chroma>=1.0.0",
    "langchain-groq>=1.1.1",
    "langchain-huggingface>=1.1.0",
    "langchain-text-splitters>=1.0.0",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.63.0",
]

[project.scripts]
jbiet-collage-chatbot = "jbiet_collage_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
